spring.application.name=openclawProject

server.port=8080

# \u6570\u636E\u6E90
spring.datasource.url=jdbc:mysql://localhost:3306/smart_info_assistant
spring.datasource.username=root
spring.datasource.password=59721
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# \u6587\u4EF6\u4E0A\u4F20
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# \u2705 MyBatis-Plus \u914D\u7F6E
# \u6307\u5B9A\u5B9E\u4F53\u7C7B\u5305\u8DEF\u5F84\uFF08\u7528\u4E8E\u7C7B\u578B\u522B\u540D\uFF09
mybatis-plus.type-aliases-package=com.itfuliang.openclawproject.entity
# \u5F00\u542F\u9A7C\u5CF0\u547D\u540D\u8F6C\u6362 (user_name -> userName)
mybatis-plus.configuration.map-underscore-to-camel-case=true
# \u6253\u5370 SQL \u65E5\u5FD7 (\u5F00\u53D1\u73AF\u5883\u5EFA\u8BAE\u5F00\u542F)
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# \u5173\u95ED XML \u6620\u5C04\u626B\u63CF (\u672C\u9879\u76EE\u7EAF\u6CE8\u89E3\u5F00\u53D1\uFF0C\u82E5\u6709\u590D\u6742 XML \u53EF\u5F00\u542F)
# mybatis-plus.mapper-locations=classpath:mapper/*.xml

# \uD83E\uDD16 Spring AI + Ollama \u914D\u7F6E
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.7